<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,follow">
    <link rel="stylesheet" href="style.css">
    <script src="nav.js" defer></script>
    <script src="directory.js?v=5" defer></script>
    <title>Preschool Learning Topic | Learning Made Simple</title>
</head>
<body>
<nav class="main-nav"><div class="logo"><span class="logo-mark">L</span><span>Learning Made Simple</span></div><div class="nav-links"></div></nav>
<section class="library">
    <div class="library-header">
        <p class="eyebrow" id="meta"></p>
        <h1 id="topic">Preschool Learning Topic</h1>
        <p id="topic-description">Resources for this topic are coming soon.</p>
    </div>
    <div id="topic-resources" class="directory-grid single-directory" hidden><div><ul id="topic-list" class="resource-link-list"></ul></div></div>
    <p><a id="grade-link" href="worksheets.html">Back to grade</a> &middot; <a id="subject-link" href="worksheets.html">Back to subject</a></p>
</section>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const query = new URLSearchParams(location.search);
    const grade = query.get("grade") || "Grade";
    const subject = query.get("subject") || "Subject";
    const topic = query.get("topic") || "Topic";
    if (grade === "Preschool" && subject === "Reading & Language" && topic === "Sound Awareness") {
        query.set("topic", "Sounds & Beginning Phonics");
        location.replace(`topic.html?${query.toString()}`);
        return;
    }
    const seoMetadata = grade === "Preschool" && subject === "Math"
        ? window.preschoolMathTopicSeoMetadata[topic]
        : grade === "Preschool" && subject === "Reading & Language"
            ? window.preschoolReadingTopicSeoMetadata[topic]
            : null;
    window.setPageSeoMetadata({title:seoMetadata?.title || `${topic} | Learning Made Simple`,description:seoMetadata?.description});
    document.getElementById("meta").textContent = `${grade} • ${subject}`;
    document.getElementById("topic").textContent = topic;
    document.getElementById("grade-link").href = grade === "Preschool" ? "preschool.html" : grade === "Kindergarten" ? "kindergarten.html" : grade === "Grade 1" ? "grade-1.html" : "grade-2.html";
    document.getElementById("subject-link").href = subject === "Math" ? "math.html" : subject === "Reading & Language" ? "reading.html" : subject === "Communication & Life Skills" ? "communication.html" : subject === "Science & Discovery" ? "science.html" : "thinking-world.html";
    const resources = window.searchWorksheetResources({grade, subject, topic});
    if (!resources.length) return;
    window.setIndexableCanonicalUrl(`topic.html?grade=${encodeURIComponent(grade)}&subject=${encodeURIComponent(subject)}&topic=${encodeURIComponent(topic)}`);
    document.getElementById("topic-description").textContent = "Choose a printable worksheet pack.";
    document.getElementById("topic-list").innerHTML = resources.map((resource) => `<li><span class="resource-name">${resource.title}</span><a class="resource-view-action" href="${resource.previewHref}">View Worksheet</a></li>`).join("");
    document.getElementById("topic-resources").hidden = false;
});
</script>
</body>
</html>
