<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="nav.js" defer></script>
    <script src="directory.js?v=3" defer></script>
    <title>Preschool Math Skills | Learning Made Simple</title>
</head>
<body>
<nav class="main-nav"><div class="logo"><span class="logo-mark">L</span><span>Learning Made Simple</span></div><div class="nav-links"></div></nav>
<section class="library">
    <div class="library-header">
        <p class="eyebrow" id="skill-meta">PRESCHOOL &bull; MATH &bull; NUMBERS &amp; COUNTING</p>
        <h1 id="skill-title">Math Skills</h1>
        <p id="skill-description"></p>
    </div>
    <div class="directory-grid single-directory"><div><ul id="skill-list" class="resource-link-list"></ul></div></div>
    <p class="directory-back-link"><a id="skill-back-link" href="numbers-counting.html">Back to Numbers &amp; Counting</a></p>
</section>
<script>
const skillDirectories = {
    counting: {
        title: "Counting",
        description: "Choose a bundled counting resource.",
        resourceIds: ["counting-objects-1-5", "counting-objects-1-10", "counting-objects-11-20"]
    },
    "number-order": {
        title: "Number Order",
        description: "Practice putting numbers in order.",
        resourceIds: ["number-order-1-10", "number-order-11-20"]
    },
    "more-fewer-same": {
        title: "More, Fewer & Same",
        description: "Compare groups by looking at their quantities.",
        resourceIds: ["more-fewer-same-1-10"]
    },
    addition: {
        title: "Early Addition & Subtraction",
        description: "Put small groups together and take groups apart.",
        meta: "PRESCHOOL \u2022 MATH \u2022 EARLY ADDITION & SUBTRACTION",
        backHref: "math.html",
        backLabel: "Back to Math",
        resourceIds: ["addition-to-5", "subtracting-within-5", "addition-facts-within-5", "subtraction-facts-within-5", "simple-addition-subtraction-stories"]
    }
};

document.addEventListener("DOMContentLoaded", () => {
    const skill = new URLSearchParams(location.search).get("skill");
    const directory = skillDirectories[skill];
    if (!directory) {
        location.replace("numbers-counting.html");
        return;
    }
    document.title = `${directory.title} | Learning Made Simple`;
    document.getElementById("skill-title").textContent = directory.title;
    document.getElementById("skill-description").textContent = directory.description;
    if (directory.meta) document.getElementById("skill-meta").textContent = directory.meta;
    if (directory.backHref) {
        const backLink = document.getElementById("skill-back-link");
        backLink.href = directory.backHref;
        backLink.textContent = directory.backLabel;
    }
    document.getElementById("skill-list").innerHTML = directory.resourceIds.map((resourceId) => {
        const resource = window.worksheetResourcesById[resourceId];
        if (!resource) throw new Error(`Unknown worksheet resource: ${resourceId}`);
        return `<li><span class="resource-name">${resource.title}</span><a class="resource-view-action" href="${resource.previewHref}">View Worksheet</a></li>`;
    }).join("");
});
</script>
</body>
</html>
