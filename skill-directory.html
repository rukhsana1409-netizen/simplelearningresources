<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="nav.js" defer></script>
    <title>Preschool Math Skills | Learning Made Simple</title>
</head>
<body>
<nav class="main-nav"><div class="logo"><span class="logo-mark">L</span><span>Learning Made Simple</span></div><div class="nav-links"></div></nav>
<section class="library">
    <div class="library-header">
        <p class="eyebrow" id="skill-meta">PRESCHOOL &bull; MATH &bull; NUMBERS &amp; COUNTING</p>
        <h1 id="skill-title">Math Skills</h1>
        <p id="skill-description"></p>
    </div>
    <div class="directory-grid single-directory"><div><ul id="skill-list" class="resource-link-list"></ul></div></div>
    <p class="directory-back-link"><a id="skill-back-link" href="numbers-counting.html">Back to Numbers &amp; Counting</a></p>
</section>
<script>
const skillDirectories = {
    counting: {
        title: "Counting",
        description: "Choose a bundled counting resource.",
        items: [
            {
                label: "Counting Objects 1-5",
                viewHref: "resource-preview.html?resource=counting-objects-1-5"
            },
            {
                label: "Counting Objects 1-10",
                viewHref: "resource-preview.html?resource=counting-objects-1-10"
            },
            {
                label: "Counting Objects 11-20",
                viewHref: "resource-preview.html?resource=counting-objects-11-20"
            }
        ]
    },
    "number-order": {
        title: "Number Order",
        description: "Practice putting numbers in order.",
        items: [
            {
                label: "Number Order 1-10",
                viewHref: "resource-preview.html?resource=number-order-1-10"
            },
            {
                label: "Number Order 11-20",
                viewHref: "resource-preview.html?resource=number-order-11-20"
            }
        ]
    },
    "more-fewer-same": {
        title: "More, Fewer & Same",
        description: "Compare groups by looking at their quantities.",
        items: [
            {
                label: "More, Fewer & Same 1-10",
                viewHref: "resource-preview.html?resource=more-fewer-same-1-10"
            }
        ]
    },
    addition: {
        title: "Early Addition & Subtraction",
        description: "Put small groups together and take groups apart.",
        meta: "PRESCHOOL \u2022 MATH \u2022 EARLY ADDITION & SUBTRACTION",
        backHref: "math.html",
        backLabel: "Back to Math",
        items: [
            {
                label: "Addition to 5",
                viewHref: "resource-preview.html?resource=addition-to-5"
            },
            {
                label: "Subtracting Within 5",
                viewHref: "resource-preview.html?resource=subtracting-within-5"
            },
            {
                label: "Addition Facts Within 5",
                viewHref: "resource-preview.html?resource=addition-facts-within-5"
            },
            {
                label: "Subtraction Facts Within 5",
                viewHref: "resource-preview.html?resource=subtraction-facts-within-5"
            }
        ]
    }
};

document.addEventListener("DOMContentLoaded", () => {
    const skill = new URLSearchParams(location.search).get("skill");
    const directory = skillDirectories[skill];
    if (!directory) {
        location.replace("numbers-counting.html");
        return;
    }
    document.title = `${directory.title} | Learning Made Simple`;
    document.getElementById("skill-title").textContent = directory.title;
    document.getElementById("skill-description").textContent = directory.description;
    if (directory.meta) document.getElementById("skill-meta").textContent = directory.meta;
    if (directory.backHref) {
        const backLink = document.getElementById("skill-back-link");
        backLink.href = directory.backHref;
        backLink.textContent = directory.backLabel;
    }
    document.getElementById("skill-list").innerHTML = directory.items.map((item) => {
        if (item.viewHref) {
            return `<li><span class="resource-name">${item.label}</span><a class="resource-view-action" href="${item.viewHref}">View Worksheet</a></li>`;
        }
        return `<li>${item.href ? `<a href="${item.href}">${item.label}</a>` : `<span>${item.label}</span><small>Coming soon</small>`}</li>`;
    }).join("");
});
</script>
</body>
</html>
