<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rocket Rescue! | Learning Made Simple</title>
<style>
:root{--ink:#1B1F4B;--cream:#FFF8E7;--sun:#FFC93C;--sun-d:#D49A00;--ok:#2FBF71;--warn:#FF8A3D;
font-family:"Arial Rounded MT Bold","Trebuchet MS",ui-rounded,"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{color:var(--cream);overflow:hidden;background:radial-gradient(circle at 18% 12%,#5A3FC0 0,transparent 42%),radial-gradient(circle at 85% 78%,#2A6BD0 0,transparent 38%),linear-gradient(#17164F,#2B2478)}
#stars{position:fixed;inset:0;pointer-events:none}
#stars i,.f-stars i{position:absolute;border-radius:50%;background:#fff}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2vh,20px);padding:max(62px,calc(env(safe-area-inset-top) + 54px)) 16px max(14px,env(safe-area-inset-bottom));text-align:center;overflow-y:auto;z-index:1}
.screen.on{display:flex}
h1,h2,p{margin:0}
h1{font-size:clamp(1.9rem,7.5vw,4.2rem);line-height:1.05;color:var(--cream);text-shadow:0 4px 0 #D9622B}
.btn{font:inherit;font-weight:800;font-size:clamp(1.2rem,3.6vw,1.7rem);min-height:64px;padding:0 34px;border:0;border-radius:999px;background:var(--sun);color:var(--ink);box-shadow:0 6px 0 var(--sun-d);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 var(--sun-d)}
.btn.big{min-height:84px;font-size:clamp(1.7rem,6vw,2.5rem);padding:0 clamp(36px,9vw,64px)}
.btn.ghost{background:rgba(255,255,255,.14);color:var(--cream);box-shadow:none;border:3px solid rgba(255,248,231,.6);min-height:48px;padding:0 20px;font-size:1rem}
:focus-visible{outline:4px solid #fff;outline-offset:4px}
.card :focus-visible{outline-color:var(--ink)}
.snd{position:fixed;top:max(10px,env(safe-area-inset-top));right:12px;z-index:90;display:flex;align-items:center;gap:8px}
.snd svg{width:1.3em;height:1.3em}
/* ---------- art ---------- */
.rk{height:100%;width:auto;display:block;overflow:visible}
.rk .flame{opacity:0;transform-box:fill-box;transform-origin:50% 0}
.rk.idle .flame,.rk.burn .flame{opacity:1}.rk.idle .flame{transform:scale(.7)}
.rk .lvl{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(var(--f,0));transition:transform .8s ease}
.rk .door,.rk .face{display:none}.rk.open .door,.rk.has .face{display:inline}.rk.open .fw{display:none}
.astro .m-s,.astro .b-s{display:none}.astro.sad .m-s,.astro.sad .b-s{display:inline}.astro.sad .m-h{display:none}
.astro .armL{transform-box:view-box;transform-origin:30px 72px}
.hero{display:flex;align-items:flex-end;justify-content:center;height:clamp(150px,32vh,290px);margin-bottom:clamp(18px,4vh,40px)}
.deco{position:absolute;z-index:0;pointer-events:none}.deco svg{width:100%;height:100%;display:block}
.screen>*:not(.deco){position:relative;z-index:1}
.tag{font-size:clamp(1.1rem,3.4vw,1.6rem);font-weight:700}
/* ---------- briefing ---------- */
#brief{overflow-y:hidden}
.bscene{position:relative;width:min(80vw,360px);height:min(36vh,310px)}
.bscene .pl{position:absolute;left:-10%;right:-10%;bottom:-48%;height:100%}
.bscene .as{position:absolute;left:38%;bottom:24%;height:76%;aspect-ratio:100/146;transform:translateX(-50%)}
.bscene .as>svg.astro,.f-astro svg.astro{height:100%;width:auto;display:block;overflow:visible}
.bubble{background:var(--cream);color:var(--ink);border-radius:28px;padding:clamp(12px,2.4vh,20px) clamp(16px,4vw,28px);font-size:clamp(1.25rem,4.2vw,2rem);font-weight:800;max-width:min(92vw,560px);box-shadow:0 8px 0 rgba(0,0,0,.2)}
.cells{display:flex;gap:8px;justify-content:center}
.cells i{width:clamp(30px,9vw,48px);height:clamp(26px,7vw,40px);border-radius:10px;background:rgba(255,255,255,.14);border:3px solid rgba(255,248,231,.55);display:grid;place-items:center}
.cells i svg{width:62%;height:70%;opacity:.55}
.cells i.full{background:linear-gradient(#7BF5A6,#2FBF71);border-color:#D6FFE6}.cells i.full svg{opacity:1}
/* ---------- mission ---------- */
#mission{justify-content:center}
.mwrap{width:min(100%,980px);display:grid;grid-template-columns:1fr;gap:clamp(6px,1.6vh,16px);justify-items:center;align-items:center;margin:auto 0}
.pad{height:clamp(110px,22vh,220px);position:relative}
.pad svg.rk{position:relative;z-index:1}
.padbase{position:absolute;left:50%;bottom:-6px;width:150%;height:16px;transform:translateX(-50%);background:#8D93C9;border-radius:10px;box-shadow:0 5px 0 #5E64A0}
.mcol{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.6vh,14px);width:100%}
.card{background:var(--cream);color:var(--ink);border-radius:28px;padding:clamp(10px,2vh,18px);width:100%;box-shadow:0 8px 0 rgba(0,0,0,.2)}
#prompt{font-size:clamp(1.3rem,4.4vw,2.1rem);line-height:1.15;margin-bottom:6px}
.viz{--it:clamp(34px,min(11vw,8vh),60px);display:flex;flex-direction:column;align-items:center;gap:6px;min-height:calc(var(--it)*1.2)}
.viz .row{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.grp{display:grid;grid-template-columns:repeat(var(--c),var(--it));gap:6px}
.it{width:var(--it);height:var(--it);position:relative}.it svg{width:100%;height:100%;display:block}
.op{font-size:clamp(1.6rem,5vw,2.4rem)}
.viz.hint .it::after{content:attr(data-n);position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);font-size:.85rem;font-weight:800;background:var(--ink);color:#fff;border-radius:8px;padding:0 6px;line-height:1.3}
.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,2.4vw,20px);width:min(100%,640px)}
.ans{font:inherit;font-weight:800;font-size:clamp(2.4rem,9vw,4.4rem);color:var(--ink);background:#fff;border:6px solid var(--sun);border-radius:28px;min-height:clamp(84px,15vh,132px);cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.25);touch-action:manipulation}
.ans:hover:not(:disabled){background:#FFF4CF}
.ans:disabled{cursor:default}
.ans.good{border-color:var(--ok);background:#E6FFF0}.ans.oops{border-color:var(--warn);background:#FFF1E4}.ans.dim{opacity:.4}
.msg{min-height:2.7em;font-size:clamp(1.15rem,3.4vw,1.6rem);font-weight:800}
.msg.ok{color:#8DF5B5}.msg.try{color:#FFD08A}
.fuelfly,.spark{position:fixed;z-index:60;pointer-events:none}
/* ---------- flight ---------- */
#flight{--rh:min(34vh,290px);--rw:calc(var(--rh)*.4762);--gy:17vh;padding:0;gap:0;overflow:hidden;z-index:2}
#flight>div,#flight>button{position:absolute}
.f-sky{inset:0}.f-day{background:linear-gradient(#69C8FF,#CFF1FF 70%,#EAFBFF)}.f-space{background:linear-gradient(#12104A,#2B2481 60%,#4B3AA8);opacity:0}
.f-stars{inset:0;opacity:0;overflow:hidden}
.f-stars .lay{position:absolute;left:0;right:0;top:0;height:100%}.f-stars .lay.b{top:-100%}
.f-ground{left:0;right:0;bottom:0;height:calc(var(--gy) + 6vh);pointer-events:none}
.f-ground .h1,.f-ground .h2{position:absolute;left:-15%;right:-15%;border-radius:50%}
.f-ground .h1{bottom:-22vh;height:34vh;background:#6BD08A}.f-ground .h2{bottom:-26vh;height:30vh;background:#4FB873}
.f-ground svg{position:absolute;left:50%;bottom:0;height:calc(var(--gy) + 4vh);width:auto;transform:translateX(-50%);overflow:visible}
.f-cloud{background:#fff;border-radius:999px;height:7vh;width:24vw;min-width:90px;opacity:.95;box-shadow:inset 0 -6px 0 #DDF3FF}
.f-surface{left:0;right:0;bottom:0;height:34vh;display:none;pointer-events:none}
.f-surface .gr{position:absolute;left:-60%;right:-60%;height:70vh;bottom:calc(-70vh + 20vh);border-radius:50%;background:var(--pc1);box-shadow:inset 0 14px 0 rgba(255,255,255,.18)}
.f-surface .cr{position:absolute;border-radius:50%;background:rgba(0,0,0,.14)}
.f-rocket{left:50%;bottom:var(--gy);width:var(--rw);height:var(--rh);margin-left:calc(var(--rw)/-2);z-index:4}
.f-astro{left:14%;bottom:calc(var(--gy) - 1vh);height:min(20vh,170px);aspect-ratio:100/146;z-index:3;display:none}
.f-astro .hop{height:100%;position:relative}
.f-sign{position:absolute;left:74%;bottom:0;width:100%}
.f-pl{position:absolute;pointer-events:none}.f-pl svg{width:100%;height:100%}
.f-note{left:0;right:0;top:calc(max(10px,env(safe-area-inset-top)) + 58px);text-align:center;font-size:clamp(1.6rem,6vw,2.8rem);font-weight:800;color:var(--ink);text-shadow:0 2px 0 rgba(255,255,255,.6);z-index:8;pointer-events:none}
.f-note.light{color:var(--cream);text-shadow:0 3px 0 rgba(0,0,0,.35)}
.f-count{left:0;right:0;top:calc(max(10px,env(safe-area-inset-top)) + 128px);text-align:center;font-size:min(clamp(4rem,22vw,11rem),18vh);font-weight:800;color:#fff;text-shadow:0 6px 0 #D9622B;z-index:8;pointer-events:none}
.f-puff{border-radius:50%;background:rgba(255,255,255,.85);z-index:5;pointer-events:none}
.veil{inset:0;background:#17164F;opacity:0;pointer-events:none;z-index:20}
#skip{background:rgba(27,31,75,.72);left:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:30}
/* ---------- celebration ---------- */
#win{justify-content:center}
.party{position:relative;width:min(92vw,520px);height:min(32vh,260px);display:flex;align-items:flex-end;justify-content:center;gap:4vw}
.party .a{height:100%}.party .a svg{height:100%;width:auto;display:block;overflow:visible}
.party .r{height:92%}
.stars3{display:flex;gap:10px}.stars3 svg{width:clamp(44px,12vw,70px);height:auto}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.conf i{position:absolute;top:-6vh;width:22px;height:22px}
/* ---------- motion (gentle, never flashing) ---------- */
@media (prefers-reduced-motion:no-preference){
 #stars i.t,.f-stars i.t{animation:tw var(--d,4s) ease-in-out infinite alternate}
 .rk .flame{animation:fl .4s ease-in-out infinite alternate}
 .bob{animation:bob 3.4s ease-in-out infinite}
 .btn.big{animation:glow 2.6s ease-in-out infinite}
 .astro .armL.wave{animation:wv .9s ease-in-out infinite alternate}
 .deco{animation:drift 9s ease-in-out infinite alternate}
 .ans.oops{animation:nope .4s ease}
 .cells i.pop{animation:pop .55s ease-out}
 .conf i{animation:fall var(--t,9s) linear var(--dl,0s) infinite}
 .f-stars.go .lay{animation:streak var(--sp,5s) linear infinite}
 .pulse{animation:pop .6s ease-out}}
@keyframes tw{from{opacity:.25}to{opacity:1}}
@keyframes fl{from{transform:scaleY(.86)}to{transform:scaleY(1.12)}}
@keyframes bob{50%{transform:translateY(-12px)}}
@keyframes glow{50%{box-shadow:0 6px 0 var(--sun-d),0 0 28px 6px rgba(255,201,60,.55)}}
@keyframes wv{from{transform:rotate(-18deg)}to{transform:rotate(22deg)}}
@keyframes drift{to{transform:translate(8px,-14px)}}
@keyframes nope{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{40%{transform:scale(1.18)}}
@keyframes fall{from{transform:translateY(0) rotate(0)}to{transform:translateY(112vh) rotate(200deg)}}
@keyframes streak{from{transform:translateY(0)}to{transform:translateY(100%)}}
/* ---------- layouts ---------- */
@media (min-width:820px) and (min-height:560px){.mwrap{grid-template-columns:minmax(200px,34%) 1fr}.pad{height:min(62vh,430px)}}
@media (max-height:560px) and (min-width:560px){
 .screen{gap:6px;padding:8px 68px 8px 16px}.btn.snd{padding:0;width:48px;justify-content:center}#sndt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}#brief.on{display:grid;grid-template-columns:minmax(120px,38%) 1fr;align-content:center;justify-items:center;column-gap:20px}#brief .bscene{grid-row:1/5;grid-column:1;width:100%;height:min(66vh,250px)}#brief>:not(.bscene){grid-column:2}#brief .tag{display:none}.f-count{left:7%;right:auto;top:34%;font-size:22vh;text-align:left}.f-note{font-size:1.5rem}.party{width:min(100%,520px)}.mwrap{grid-template-columns:minmax(110px,26%) 1fr}.pad{height:min(64vh,260px)}
 #prompt{font-size:1.2rem;margin-bottom:2px}.viz{--it:clamp(26px,min(6vw,9vh),44px)}.hero{margin-bottom:12px}.ans{min-height:64px;font-size:2.2rem}.msg{min-height:1.5em;font-size:1.05rem}
 .btn{min-height:50px}.btn.big{min-height:56px;font-size:1.5rem}.hero{height:30vh}.bscene{height:30vh}h1{font-size:2rem}.bubble{font-size:1.1rem;padding:8px 16px}.party{height:34vh}.card{padding:8px 12px}.cells i{height:24px}}
@media (max-width:559px) and (max-height:700px){.pad{height:13vh}.viz{--it:clamp(30px,min(10vw,7vh),52px)}.btn.big{min-height:68px}.ans{min-height:76px}#prompt{font-size:1.25rem}}
@media (max-height:400px) and (min-width:560px){.pad{height:min(58vh,200px)}.ans{min-height:54px;font-size:1.9rem}.btn.big{min-height:46px;font-size:1.3rem}.card{padding:6px 10px}#prompt{font-size:1.05rem}.viz{--it:clamp(22px,min(5.6vw,8vh),34px)}.cells i{height:22px}.msg{min-height:1.3em;font-size:1rem}.bubble{font-size:1rem;padding:6px 12px}.mcol{gap:3px}.ans{min-height:50px}.btn.big{min-height:42px}}
@media (max-width:359px) and (max-height:600px){.ans{min-height:66px}.btn.big{min-height:58px}.viz{--it:clamp(28px,9.5vw,40px)}.msg{min-height:2.2em}}
</style>
</head>
<body>
<div id="stars" aria-hidden="true"></div>
<button class="btn ghost snd" id="snd" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="wave" d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12" hidden/><path id="mute" d="M16 9l5 6M21 9l-5 6"/></svg><span id="sndt">Sound off</span></button>

<section id="start" class="screen on" aria-label="Start">
 <div class="deco" id="d1" style="width:clamp(90px,20vw,190px);height:clamp(90px,20vw,190px);left:6%;top:14%"></div>
 <div class="deco" id="d2" style="width:clamp(60px,14vw,130px);height:clamp(60px,14vw,130px);right:8%;top:30%"></div>
 <div class="deco" id="d3" style="width:clamp(70px,16vw,150px);height:clamp(70px,16vw,150px);right:14%;bottom:8%"></div>
 <div class="hero bob" id="heroRk"></div>
 <h1>Rocket Rescue!</h1>
 <p class="tag">Math missions in space</p>
 <button class="btn big" id="play" data-focus>PLAY</button>
</section>

<section id="brief" class="screen" aria-label="Mission briefing">
 <p class="tag">Incoming message!</p>
 <div class="bscene" id="bscene"></div>
 <div class="bubble">An astronaut needs your help! Let's rescue them!</div>
 <div class="cells" id="goal" aria-label="Fill the fuel tank"></div>
 <button class="btn big" id="go" data-focus>LET'S GO!</button>
</section>

<section id="mission" class="screen" aria-label="Fuel the rocket">
 <div class="mwrap">
  <div class="pad" id="pad"></div>
  <div class="mcol">
   <div class="cells" id="cells" aria-label="Fuel tank"></div>
   <p class="sr" id="count" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></p>
   <div class="card"><h2 id="prompt"></h2><div class="viz" id="viz"></div></div>
   <div class="answers" id="answers" role="group" aria-label="Answers"></div>
   <p class="msg" id="msg" role="status" aria-live="polite"></p>
   <button class="btn big" id="next" hidden>NEXT</button>
  </div>
 </div>
</section>

<section id="flight" class="screen" aria-label="Launch">
 <div class="f-sky f-day"></div><div class="f-sky f-space" id="fspace"></div>
 <div class="f-stars" id="fstars"></div>
 <div class="f-ground" id="fground"><div class="h2"></div><div class="h1"></div></div>
 <div class="f-surface" id="fsurface"><div class="gr"></div></div>
 <div class="f-astro" id="fastro"></div>
 <div class="f-rocket" id="frocket"></div>
 <div class="f-note" id="fnote" aria-live="polite"></div>
 <div class="f-count" id="fcount" aria-hidden="true"></div>
 <div class="veil" id="veil"></div>
 <button class="btn ghost" id="skip">Skip</button>
</section>

<section id="win" class="screen" aria-label="Mission complete">
 <div class="conf" id="conf" aria-hidden="true"></div>
 <div class="party" id="party"></div>
 <h1>Mission Complete!</h1>
 <p class="tag" id="wintext"></p>
 <div class="stars3" id="stars3" role="img"></div>
 <button class="btn big" id="again" data-focus>PLAY AGAIN</button>
</section>

<script>
/* =====================================================================
   ROCKET RESCUE! mission 1 (counting and addition within 10)
   Sections: helpers | art | sound | questions | mission | flight | win
   To extend later: add entries to MISSION (questions, ranges) and new question types in QTYPES.
   ===================================================================== */
const MISSION={questions:6,maxByStep:[6,6,8,8,10,10]};
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[rnd(0,a.length-1)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const RMQ=matchMedia("(prefers-reduced-motion: reduce)"),RM=()=>RMQ.matches;
const wait=ms=>new Promise(r=>setTimeout(r,RM()?Math.min(ms,450):ms));
const anim=(el,kf,o={})=>{try{return el.animate(kf,Object.assign({duration:700,fill:"forwards",easing:"ease"},o,RM()?{duration:1,delay:0}:{})).finished.catch(()=>{})}catch(e){return Promise.resolve()}};
/* ---------- art (original inline SVG) ---------- */
const INK="#1B1F4B",OUT=`stroke="${INK}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;
const ROCKET=(cls="")=>`<svg class="rk ${cls}" viewBox="0 0 120 252" aria-hidden="true" focusable="false">
<g class="flame"><path d="M42 222Q60 310 78 222Z" fill="#FF9F43"/><path d="M50 222Q60 280 70 222Z" fill="#FFE27A"/></g>
<path d="M34 168L8 222V238L40 214Z" fill="#FF6B5E" ${OUT}/><path d="M86 168L112 222V238L80 214Z" fill="#FF6B5E" ${OUT}/>
<path d="M44 222L38 246M76 222L82 246" ${OUT} stroke-width="5" fill="none"/><path d="M30 247H46M74 247H90" ${OUT} stroke-width="5" fill="none"/>
<path d="M60 8C90 40 94 92 92 190V214Q92 222 84 222H36Q28 222 28 214V190C26 92 30 40 60 8Z" fill="#fff" ${OUT} stroke-width="4"/>
<path d="M60 8C74 22 83 42 87 64H33C37 42 46 22 60 8Z" fill="#FF6B5E" ${OUT} stroke-width="4"/>
<rect x="30" y="128" width="60" height="12" fill="#4C93FF"/>
<circle cx="60" cy="96" r="17" fill="#CFEFFF" ${OUT} stroke-width="4"/><path d="M50 90Q54 85 60 84" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
<g class="face"><circle cx="60" cy="97" r="12" fill="#FFD9B8"/><circle cx="55.5" cy="95" r="2" fill="${INK}"/><circle cx="64.5" cy="95" r="2" fill="${INK}"/><path d="M54 102Q60 108 66 102" stroke="${INK}" stroke-width="2.4" fill="none" stroke-linecap="round"/></g>
<g class="fw"><rect x="46" y="152" width="28" height="50" rx="8" fill="${INK}"/><rect class="lvl" x="49" y="155" width="22" height="44" rx="5" fill="#5DE68B"/><path d="M61 163L53 178H59L57 192L68 174H62Z" fill="#fff" opacity=".9"/></g>
<g class="door"><rect x="46" y="152" width="28" height="50" rx="8" fill="#FFE9A8" ${OUT}/></g></svg>`;
const ASTRO=(suit,mood="sad",cls="")=>`<svg class="astro ${mood} ${cls}" viewBox="0 -6 100 146" aria-hidden="true" focusable="false">
<rect x="22" y="58" width="56" height="46" rx="12" fill="#B9C2D9" ${OUT}/>
<rect x="32" y="98" width="14" height="28" rx="6" fill="${suit}" ${OUT}/><rect x="54" y="98" width="14" height="28" rx="6" fill="${suit}" ${OUT}/>
<rect x="28" y="120" width="21" height="13" rx="6" fill="${INK}"/><rect x="51" y="120" width="21" height="13" rx="6" fill="${INK}"/>
<rect x="28" y="62" width="44" height="44" rx="14" fill="${suit}" ${OUT}/><rect x="40" y="76" width="20" height="13" rx="4" fill="#fff" opacity=".85"/><circle cx="46" cy="82" r="2.4" fill="#FF6B5E"/><circle cx="54" cy="82" r="2.4" fill="#4C93FF"/>

 R().classList.remove("open");R().classList.add("has");note.textContent="Rescued!";await wait(900);if(!alive())return;

/* ---------- celebration ---------- */
function celebrate(){
 S.run++;const st=S.first>=5?3:S.first>=3?2:1,name=S.crew.n;
 $("#party").innerHTML=`<div class="a">${ASTRO(S.crew.suit,"happy")}</div><div class="r bob">${ROCKET("idle has")}</div>`;
 $("#party .armL").classList.add("wave");$("#party .rk").style.setProperty("--f",1);
 $("#wintext").textContent=`You rescued ${name} from Planet ${S.planet.n}!`;
 $("#stars3").setAttribute("aria-label",`${st} out of 3 stars`);$("#stars3").innerHTML=[1,2,3].map(i=>STAR(i<=st?"#FFC93C":"rgba(255,255,255,.25)")).join("");
 $("#conf").innerHTML=RM()?"":Array.from({length:22},()=>`<i style="left:${rnd(0,98)}%;--t:${rnd(8,13)}s;--dl:-${rnd(0,10)}s">${STAR(pick(["#FFC93C","#FF8FB1","#7BF5A6","#7FB7FF","#B79CFF"]))}</i>`).join("");
 go("win");sfx("win")}

starField($("#stars"),90,true,true);

[["#d1",PLANET("#F28A65","#FFD0B5",false)],["#d2",PLANET("#4FC9A5","#BFF3E3",false)],["#d3",PLANET("#8E7CF0","#CFC6FF",true)]].forEach(([s,h])=>$(s).innerHTML=h);
$("#play").onclick=()=>{sfx("tick");showBrief()};

$("#answers").addEventListener("click",e=>{const b=e.target.closest(".ans");if(b)answer(b)});
$("#next").onclick=()=>{if(!S.locked)return;if($("#next").dataset.last)fly();else{S.i++;showQ()}};
$("#skip").onclick=()=>{S.run++;celebrate()};
$("#again").onclick=()=>{sfx("tick");showBrief()};
$("#snd").onclick=()=>{setSound(!sound);sfx("tick")};
document.addEventListener("keydown",e=>{
 if(!$("#mission").classList.contains("on")||S.locked&&!/^[1-3]$/.test(e.key))return;
 if(/^[1-3]$/.test(e.key)){const b=document.querySelectorAll(".ans")[+e.key-1];if(b&&!b.disabled)answer(b)}
 else if(e.key==="ArrowRight"||e.key==="ArrowLeft"){const bs=[...document.querySelectorAll(".ans:not(:disabled)")],k=bs.indexOf(document.activeElement);if(bs.length){bs[(k<0?0:k+(e.key==="ArrowRight"?1:bs.length-1))%bs.length].focus();e.preventDefault()}}});
</script>
