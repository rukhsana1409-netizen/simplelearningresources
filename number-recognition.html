<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/site-icon-192x192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="canonical" href="https://simplelearningresources.com/number-recognition.html">
    <meta name="description" content="Printable preschool number recognition worksheets for finding, counting, and tracing numbers 1 through 20.">
    <link rel="stylesheet" href="style.css">
    <script src="nav.js" defer></script>
    <script src="directory.js?v=22" defer></script>
    <title>Number Recognition Worksheets 1-20 | Learning Made Simple</title>
</head>
<body>
<nav class="main-nav"><div class="logo"><img class="logo-mark" src="/site-icon-source.png" alt="" width="34" height="34"><span>Learning Made Simple</span></div><div class="nav-links"></div></nav>
<section class="library">
    <div class="library-header">
        <p class="eyebrow">PRESCHOOL &bull; MATH &bull; NUMBERS &amp; COUNTING</p>
        <h1>Number Recognition</h1>
        <p>Choose a worksheet bundle to preview.</p>
    </div>
    <div class="directory-grid single-directory">
        <div>
            <ul id="number-recognition-list" class="resource-link-list"></ul>
        </div>
    </div>
    <p class="directory-back-link"><a href="numbers-counting.html">Back to Numbers &amp; Counting</a></p>
</section>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const resources = window.worksheetResources.filter((resource) => resource.skill === "Number Recognition" || resource.id === "trace-numbers-1-20");
    document.getElementById("number-recognition-list").innerHTML = resources.map((resource) =>
        `<li><span class="resource-name">${resource.title}<small class="resource-description">${resource.description}</small></span><a class="resource-view-action" href="${resource.previewHref}">View Worksheet</a></li>`
    ).join("");
});
</script>
</body>
</html>
