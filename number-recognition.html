<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Preschool number recognition worksheet bundles for numbers 1 through 10.">
    <link rel="stylesheet" href="style.css">
    <script src="nav.js" defer></script>
    <script src="directory.js?v=5" defer></script>
    <title>Number Recognition | Learning Made Simple</title>
</head>
<body>
<nav class="main-nav"><div class="logo"><span class="logo-mark">L</span><span>Learning Made Simple</span></div><div class="nav-links"></div></nav>
<section class="library">
    <div class="library-header">
        <p class="eyebrow">PRESCHOOL &bull; MATH &bull; NUMBERS &amp; COUNTING</p>
        <h1>Number Recognition</h1>
        <p>Choose a worksheet bundle to preview.</p>
    </div>
    <div class="directory-grid single-directory">
        <div>
            <ul id="number-recognition-list" class="resource-link-list"></ul>
        </div>
    </div>
    <p class="directory-back-link"><a href="numbers-counting.html">Back to Numbers &amp; Counting</a></p>
</section>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const resources = window.worksheetResources.filter((resource) => resource.skill === "Number Recognition");
    document.getElementById("number-recognition-list").innerHTML = resources.map((resource) =>
        `<li><span class="resource-name">${resource.title}<small class="resource-description">${resource.description}</small></span><a class="resource-view-action" href="${resource.previewHref}">View Worksheet</a></li>`
    ).join("");
});
</script>
</body>
</html>
