name = "lms-download-analytics"
main = "src/worker.mjs"
compatibility_date = "2026-10-15"
workers_dev = true
send_metrics = false

[vars]
DASHBOARD_ENABLED = "true"
GAME_DASHBOARD_ENABLED = "false"
CATALOG_METADATA_URL = "https://simplelearningresources.com/download-analytics-catalog.json"
CATALOG_METADATA_FALLBACK_URL = "https://raw.githubusercontent.com/rukhsana1409-netizen/simplelearningresources/main/download-analytics-catalog.json"
GAME_METADATA_URL = "https://simplelearningresources.com/game-analytics-catalog.json"
GAME_METADATA_FALLBACK_URL = "https://raw.githubusercontent.com/rukhsana1409-netizen/simplelearningresources/main/game-analytics-catalog.json"

[analytics]
binding = "ANALYTICS_SQL"

[[analytics_engine_datasets]]
binding = "DOWNLOAD_ANALYTICS"
dataset = "lms_download_clicks"
